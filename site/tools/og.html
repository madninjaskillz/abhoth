<!doctype html>
<!-- The OpenGraph card (public/img/og.png, 1200x630). Regenerate: node tools/og.mjs (needs playwright). -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#0e0816;color:#f4edfb;font-family:"Segoe UI",system-ui,sans-serif;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(700px 420px at 85% 30%,rgba(195,88,244,.38),transparent 65%),radial-gradient(500px 300px at 0% 0%,rgba(249,100,157,.16),transparent 70%),radial-gradient(600px 300px at 40% 120%,rgba(233,164,56,.16),transparent 70%)}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff9,transparent 60%),radial-gradient(1.5px 1.5px at 32% 82%,#fff7,transparent 60%),radial-gradient(2px 2px at 58% 12%,#ffcf70,transparent 60%),radial-gradient(1.5px 1.5px at 46% 60%,#fff6,transparent 60%),radial-gradient(1.5px 1.5px at 92% 88%,#df69ff,transparent 60%),radial-gradient(1.5px 1.5px at 6% 70%,#fff8,transparent 60%)}
.txt{position:absolute;left:72px;top:110px;width:640px}
.brand{font-size:34px;font-weight:800;letter-spacing:-.01em;color:#ffcf70;margin-bottom:26px;display:flex;align-items:center;gap:14px}
h1{font-size:72px;line-height:1.04;margin:0 0 26px;font-weight:800;letter-spacing:-.035em}
.g{background:linear-gradient(100deg,#d48bff,#f9649d 50%,#ffcf70);-webkit-background-clip:text;color:transparent}
p{font-size:28px;color:#c3b3d6;margin:0}
img{position:absolute;right:40px;top:120px;width:440px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.5))}
.url{position:absolute;left:72px;bottom:56px;font-size:24px;color:#9d8bb3;font-family:Consolas,monospace}
</style></head><body><div class="bg"></div><div class="stars"></div>
<div class="txt"><div class="brand">ABHOTH</div><h1>The coding agent for <span class="g">the models you run.</span></h1><p>Terminal · Web UI · Desktop · Self-hosted · MIT</p></div>
<img src="../public/img/abhoth.svg" alt=""><div class="url">github.com/madninjaskillz/abhoth</div></body></html>
