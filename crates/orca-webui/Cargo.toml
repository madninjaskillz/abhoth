[package]
name = "orca-webui"
description = "The web UI host (port of OpenOrca.WebUi): axum server, the websocket hub, projects, files, git, terminal, bench."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mdns-sd.workspace = true
orca-abstractions.workspace = true
orca-core.workspace = true
orca-sensors.workspace = true
orca-supervisor.workspace = true
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
axum = { workspace = true, features = ["ws", "query", "multipart"] }
futures-util.workspace = true
getrandom.workspace = true
mime_guess.workspace = true
percent-encoding.workspace = true
portable-pty.workspace = true
regex.workspace = true
reqwest.workspace = true
rust-embed = { workspace = true, features = ["interpolate-folder-path"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha1.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
qrcode.workspace = true
rusqlite.workspace = true
argon2.workspace = true
image.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
orca-calendar.workspace = true
orca-router.workspace = true
orca-testkit.workspace = true
orca-tools-fs.workspace = true
orca-tools-utility.workspace = true
tokio-tungstenite.workspace = true

# Windows: DPAPI seals saved GitHub tokens at rest (see `src/git/secret_box.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

# The workspace lints, except `unsafe_code` is `deny` (not `forbid`) so `src/git/secret_box.rs`
# can allow its single audited DPAPI call. Keep in step with [workspace.lints].
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
