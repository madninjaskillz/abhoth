[package]
name = "orca-router"
description = "abhoth router: the OpenAI-compatible gateway in front of DeepThought's engines (replaces LiteLLM, qfn-lb, pig-slots and the on-demand relay; design in ROUTER.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The small binary the Docker image ships; `abhoth router` (orca-cli) runs the same code.
[[bin]]
name = "abhoth-router"
path = "src/bin/abhoth_router.rs"

# A stand-in for the `claude` CLI that replays recorded stream-json (the Claude engine's tests).
[[bin]]
name = "abhoth-fake-claude"
path = "src/bin/fake_claude.rs"
required-features = ["claude-engine"]
test = false

[features]
# The Claude engine (src/claude): Claude models as routes, answered by the Claude Code CLI under
# the operator's own subscription. Off by default; no third-party code, it spawns `claude -p`.
claude-engine = []

[dependencies]
orca-core.workspace = true
orca-calendar.workspace = true
orca-alerts.workspace = true
chrono-tz.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
futures-util.workspace = true
indexmap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
rusqlite.workspace = true
toml.workspace = true
toml_edit.workspace = true

[dev-dependencies]
tempfile.workspace = true
# the hostd protocol types, to check the router speaks them (not linked into the router)
orca-hostd = { path = "../orca-hostd" }
tokio = { workspace = true, features = ["signal", "test-util"] }

[lints]
workspace = true
