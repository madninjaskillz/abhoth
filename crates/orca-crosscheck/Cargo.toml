[package]
name = "orca-crosscheck"
description = "Runs scripted sessions through the C# and the Rust openorca against the same fake model server and compares tool calls, requests, output and files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
orca-testkit.workspace = true
anyhow.workspace = true
base64.workspace = true
image.workspace = true
portable-pty.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
vt100.workspace = true
walkdir.workspace = true

# Windows: one FFI call (see `src/ctrl_c.rs`) so the binaries under test get Ctrl+C.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

# The workspace lints, except `unsafe_code` is `deny` (not `forbid`) so `src/ctrl_c.rs` can
# allow its single audited call. Keep in step with [workspace.lints].
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
