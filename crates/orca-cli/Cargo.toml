[package]
name = "orca-cli"
description = "The abhoth command-line program (Rust port of OpenOrca.Cli)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "abhoth"
path = "src/main.rs"

# The desktop app without a console window (Start-menu shortcut); same as `abhoth --desktop`.
[[bin]]
name = "abhoth-desktop"
path = "src/bin/abhoth_desktop.rs"
required-features = ["desktop"]

[lib]
path = "src/lib.rs"

[dependencies]
orca-abstractions.workspace = true
orca-core.workspace = true
orca-tools-fs.workspace = true
orca-tools-shell.workspace = true
orca-tools-pi.workspace = true
orca-tools-git.workspace = true
orca-tools-web.workspace = true
orca-tools-agent.workspace = true
orca-tools-utility.workspace = true
orca-webui.workspace = true
orca-tools-common.workspace = true
orca-tools-archive = { workspace = true, optional = true }
orca-router = { workspace = true, optional = true }
# `abhoth engine validate|index|fit|schema` (engine packages, D153).
orca-engines.workspace = true
orca-bridge = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
# This machine (D155): the in-process router's admin API, the manual engines' mirror.
axum = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
toml_edit = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
orca-supervisor = { workspace = true, optional = true }
orca-tools-network = { workspace = true, optional = true }
async-trait.workspace = true
orca-tools-mcp = { workspace = true, optional = true }
orca-tools-lsp = { workspace = true, optional = true }
orca-tools-image = { workspace = true, optional = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
crossterm.workspace = true
chrono.workspace = true
unicode-width.workspace = true
regex.workspace = true
reqwest.workspace = true
wry = { workspace = true, optional = true }
tao = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
velopack = { workspace = true, optional = true }
image = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[features]
# Optional tool groups (PORTING.md "Plugins"): on by default, like the C# plugin folder.
default = ["archive", "network", "mcp", "lsp", "image", "router", "supervisor", "bridge"]
archive = ["dep:orca-tools-archive"]
network = ["dep:orca-tools-network"]
mcp = ["dep:orca-tools-mcp"]
lsp = ["dep:orca-tools-lsp"]
image = ["dep:orca-tools-image"]
# `abhoth router`: the gateway that replaces LiteLLM on DeepThought (ROUTER.md).
router = ["dep:orca-router"]
# `abhoth bridge` and the desktop app's Bridge mode (ROUTER-MEDIA-PLAN.md 11).
bridge = ["dep:orca-bridge", "dep:toml", "dep:axum", "dep:tower-service", "dep:toml_edit", "dep:getrandom", "dep:futures-util"]
# `abhoth supervisor` and `--with-supervisor` (docs/design/SUPERVISOR.md; D148).
supervisor = ["dep:orca-supervisor"]
# `abhoth router` with the Claude engine (orca-router/claude-engine).
claude-engine = ["router", "orca-router/claude-engine"]
# `abhoth --desktop`: the web UI in a native window (WebView2 / WKWebView / WebKitGTK).
desktop = ["dep:wry", "dep:tao", "dep:tray-icon", "dep:rfd", "dep:image", "dep:futures-util", "dep:velopack"]

# Windows targets: the icon and version info in abhoth.exe / abhoth-desktop.exe (build.rs, D117).
# Not host-specific, so a Linux host cross-compiling for Windows embeds them too (llvm-rc).
[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
reqwest.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
orca-testkit.workspace = true
tempfile.workspace = true
async-trait.workspace = true
regex.workspace = true

[lints]
workspace = true
