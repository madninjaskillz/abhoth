[package]
name = "orca-cli"
description = "The openorca command-line program (port of OpenOrca.Cli)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "openorca"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
# Optional tool groups (C# plugin assemblies); all on by default.
default = ["mcp", "lsp", "image"]
mcp = ["dep:orca-tools-mcp"]
lsp = ["dep:orca-tools-lsp"]
image = ["dep:orca-tools-image"]

[dependencies]
orca-abstractions.workspace = true
orca-core.workspace = true
orca-tools-fs.workspace = true
orca-tools-shell.workspace = true
orca-tools-mcp = { workspace = true, optional = true }
orca-tools-lsp = { workspace = true, optional = true }
orca-tools-image = { workspace = true, optional = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
orca-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
