[package]
name = "orca-bridge"
description = "abhoth bridge (ROUTER-MEDIA-PLAN.md 11, 13.1-13.2): the protocol between a router and a bridge, the stream multiplexer both ends share, and the bridge itself (dial loop, detection, engine supervisor)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The headless bridge on its own (the abhoth-bridge image); `abhoth bridge` runs the same code.
[[bin]]
name = "abhoth-bridge"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures-util = { workspace = true, features = ["sink"] }
getrandom.workspace = true
indexmap.workspace = true
# Engine packages (D153): the shared runner starts `package = "..."` engines.
orca-engines.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-tungstenite.workspace = true
toml.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["ws"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["signal", "test-util"] }

[lints]
workspace = true
