[package]
name = "orca-supervisor"
description = "abhoth supervisor: the umbrella of the Abhoth Supervisor (SUPERVISOR.md 2.2): the telemetry hub and feed, subsystem wiring. Not wired into the CLI yet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Nodens, the supervisor on its own (docs/NAMES.md); `abhoth-supervisor` is its old name.
[[bin]]
name = "abhoth-nodens"
path = "src/bin/abhoth_nodens.rs"

[[bin]]
name = "abhoth-supervisor"
path = "src/bin/abhoth_supervisor.rs"

[dependencies]
orca-calendar.workspace = true
orca-sensors.workspace = true
orca-hostd.workspace = true
orca-gpuctl.workspace = true
orca-homeassistant.workspace = true
orca-alerts.workspace = true
async-trait.workspace = true
axum.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "process", "net", "io-util"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
