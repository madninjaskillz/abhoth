# abhoth-supervisor config: `abhoth-supervisor check --config FILE`, then `run`.
[supervisor]
server = "gpu-host"                       # slug for MQTT topics / unique ids
name = "GPU host"
hostd_socket = "/run/abhoth/hostd.sock"   # or hostd_command = ["ssh", …] (forced-command relay)
push_policy = false                       # true: send the tables below to hostd as policy.put
router_url = "http://127.0.0.1:8099"
router_key = { file = "/mnt/Apps/abhoth/etc/secrets/router_ha_key" }
slots_url = "http://127.0.0.1:8099/list" # the router's slots port: slot counts and slot leases
listen = "127.0.0.1:9890"                 # /api/v1/supervisor/snapshot, /stream, /history

# The policy tables (the same as hostd's policy-put TOML).
[cards.A]
uuid = "GPU-aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
bus = "21:00.0"
[power.A]
serving = "unlocked"
allow_cap = false

[mqtt]
enabled = false
url = "mqtt://broker.lan:1883"
client_id = "abhoth-supervisor-gpu-host"
username = { file = "/mnt/Apps/abhoth/etc/secrets/mqtt_user" }
password = { file = "/mnt/Apps/abhoth/etc/secrets/mqtt_password" }
legacy_ids = false          # true only once ha-bridge is stopped (CUTOVER.md)
clear_legacy_topics = false
legacy_card = "B"

# Host-local sources the Python dash polled (storage, containers, ooms, models, image, services).
[local]
host_json = "/path/to/dash/state/host.json"   # the dash collector's output (root cron)
image_url = "http://127.0.0.1:8189/health"
interval_seconds = 5
services = [
  { name = "abhoth router", group = "LLM", kind = "tcp", port = 8010 },
  { name = "ComfyUI", group = "Media", kind = "http", port = 8188, path = "/system_stats" },
  { name = "GPU fan ESP32", group = "Infra", kind = "fans" },
]
# host.json names host paths (the ninfer request logs); where they are mounted here.
path_map = [["/mnt/Storage/ai/ninfer/logs", "/ninfer-logs"]]
# Daily jobs whose newest run_daily_<date>.log Glance shows (read-only mounts of the log folders).
pipelines = [
  { name = "AI News", logs = "/video-logs/ai-news/run_daily_*.log" },
  { name = "Video Game News", logs = "/video-logs/game-news/run_daily_*.log" },
]
