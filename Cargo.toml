[workspace]
resolver = "3"
members = [
    "crates/orca-abstractions",
    "crates/orca-core",
    "crates/orca-tools-common",
    "crates/orca-tools-fs",
    "crates/orca-tools-shell",
    "crates/orca-cli",
    "crates/orca-testkit",
    "crates/orca-crosscheck",
]

[workspace.package]
version = "0.15.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

# Versions are pinned exactly (=x.y.z) and Cargo.lock is committed: third-party code is
# untrusted, so upgrades are deliberate (see PORTING.md, "Dependencies").
[workspace.dependencies]
orca-abstractions = { path = "crates/orca-abstractions" }
orca-core = { path = "crates/orca-core" }
orca-tools-common = { path = "crates/orca-tools-common" }
orca-tools-fs = { path = "crates/orca-tools-fs" }
orca-tools-shell = { path = "crates/orca-tools-shell" }
orca-testkit = { path = "crates/orca-testkit" }

anyhow = "=1.0.105"
async-trait = "=0.1.92"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
globset = "=0.4.22"
indexmap = { version = "=2.14.2", features = ["serde"] }
regex = "=1.13.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.10.8"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync", "net"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter", "std"] }
walkdir = "=2.5.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
