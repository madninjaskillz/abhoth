[workspace]
resolver = "3"
members = [
    "crates/orca-abstractions",
    "crates/orca-core",
    "crates/orca-tools-common",
    "crates/orca-tools-fs",
    "crates/orca-tools-shell",
    "crates/orca-tools-git",
    "crates/orca-tools-web",
    "crates/orca-tools-agent",
    "crates/orca-tools-utility",
    "crates/orca-tools-archive",
    "crates/orca-tools-network",
    "crates/orca-tools-mcp",
    "crates/orca-tools-lsp",
    "crates/orca-tools-image",
    "crates/orca-tools-pi",
    "crates/orca-webui",
    "crates/orca-cli",
    "crates/orca-testkit",
    "crates/orca-crosscheck",
    "crates/orca-router",
    "crates/orca-sensors",
    "crates/orca-fans",
    "crates/orca-gpuctl",
    "crates/orca-hostd",
    "crates/orca-calendar",
    "crates/orca-alerts",
    "crates/orca-homeassistant",
    "crates/orca-supervisor",
]

[workspace.package]
version = "0.16.14"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

# Versions are pinned exactly (=x.y.z) and Cargo.lock is committed: third-party code is
# untrusted, so upgrades are deliberate (see PORTING.md, "Dependencies").
[workspace.dependencies]
orca-abstractions = { path = "crates/orca-abstractions" }
orca-core = { path = "crates/orca-core" }
orca-tools-common = { path = "crates/orca-tools-common" }
orca-tools-fs = { path = "crates/orca-tools-fs" }
orca-tools-shell = { path = "crates/orca-tools-shell" }
orca-tools-git = { path = "crates/orca-tools-git" }
orca-tools-web = { path = "crates/orca-tools-web" }
orca-tools-agent = { path = "crates/orca-tools-agent" }
orca-tools-utility = { path = "crates/orca-tools-utility" }
orca-tools-archive = { path = "crates/orca-tools-archive" }
orca-tools-network = { path = "crates/orca-tools-network" }
orca-tools-mcp = { path = "crates/orca-tools-mcp" }
orca-tools-lsp = { path = "crates/orca-tools-lsp" }
orca-tools-image = { path = "crates/orca-tools-image" }
orca-tools-pi = { path = "crates/orca-tools-pi" }
orca-testkit = { path = "crates/orca-testkit" }
orca-webui = { path = "crates/orca-webui" }
orca-router = { path = "crates/orca-router" }
orca-sensors = { path = "crates/orca-sensors" }
orca-supervisor = { path = "crates/orca-supervisor" }
orca-fans = { path = "crates/orca-fans" }
orca-gpuctl = { path = "crates/orca-gpuctl" }
orca-calendar = { path = "crates/orca-calendar" }
orca-alerts = { path = "crates/orca-alerts" }
orca-hostd = { path = "crates/orca-hostd" }
orca-homeassistant = { path = "crates/orca-homeassistant" }

anyhow = "=1.0.105"
async-trait = "=0.1.92"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
# The Supervisor's calendar (SUPERVISOR.md 8): occurrences in local time across DST, from the IANA database.
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }
crossterm = "=0.29.0"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "=0.23.1"
flate2 = { version = "=1.1.11", default-features = false, features = ["zlib-rs"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
getrandom = "=0.4.3"
globset = "=0.4.22"
# Only for `hyper::ext::ReasonPhrase` (web_fetch's "HTTP <code> <reason>"); already in the tree via reqwest.
hyper = { version = "=1.13.0", default-features = false, features = ["http1", "client"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
mime_guess = "=2.0.5"
# LAN discovery of routers (D149): DNS-SD over mDNS, no async runtime, no logging.
mdns-sd = { version = "=0.21.7", default-features = false }
percent-encoding = "=2.3.2"
# PTY: the web UI terminal panel and the cross-check's interactive scenarios (ConPTY on Windows).
portable-pty = "=0.9.0"
rust-embed = "=8.14.0"
# grep: .NET-style lookaround and backreferences (D112).
fancy-regex = "=0.20.2"
# Desktop app (orca-cli feature "desktop", PORTING.md phase 7): the Tauri project's webview,
# windowing and tray crates, used directly; rfd for the native folder dialog.
wry = "=0.57.4"
tao = "=0.37.0"
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }
rfd = "=0.18.0"
# The desktop app's installer hooks and auto-update from GitHub Releases (orca-cli feature
# "desktop", D136); the same version as the vpk that packs the releases (ci.yml, deploy/ci-runner).
velopack = { version = "=1.2.161", default-features = false }
# The icon and version info in the Windows executables (orca-cli build script, D117).
embed-resource = "=3.0.12"
indexmap = { version = "=2.14.2", features = ["serde"] }
regex = "=1.13.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "transport-child-process", "base64"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order", "raw_value"] }
sha2 = "=0.10.8"
sha1 = "=0.10.7"
hmac = "=0.12.1"
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
qrcode = { version = "=0.14.1", default-features = false }
# Web UI accounts (D140): the SQLite user database and Argon2id password hashes.
rusqlite = { version = "=0.43.0", features = ["bundled"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "password-hash"] }
tempfile = "=3.27.0"
# The router control plane's config (ROUTER-CONFIG.md D-RC1): parse, and edit keeping comments.
toml = { version = "=1.2.3", features = ["preserve_order"] }
toml_edit = "=0.25.21"
tokio-tungstenite = "=0.29.0"
# Supervisor HA (SUPERVISOR.md 11): the MQTT client; rumqttd is the in-process broker for tests only.
rumqttc = { version = "=0.25.1", default-features = false, features = ["use-rustls"] }
rumqttd = { version = "=0.20.0", default-features = false }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync", "net"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter", "std"] }
unicode-normalization = "=0.1.23"
unicode-width = "=0.2.2"
# orca-crosscheck only: the screen model for interactive scenarios.
vt100 = "=0.18.1"
walkdir = "=2.5.1"
windows-version = "=0.1.1"
# orca-crosscheck (Windows: SetConsoleCtrlHandler) and orca-webui (Windows: DPAPI); already in the tree.
windows-sys = "=0.61.2"
zip = { version = "=9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
