[workspace]
resolver = "3"
members = [
    "crates/orca-abstractions",
    "crates/orca-core",
    "crates/orca-tools-common",
    "crates/orca-tools-fs",
    "crates/orca-tools-shell",
    "crates/orca-tools-git",
    "crates/orca-tools-web",
    "crates/orca-tools-utility",
    "crates/orca-tools-archive",
    "crates/orca-tools-network",
    "crates/orca-tools-mcp",
    "crates/orca-tools-lsp",
    "crates/orca-tools-image",
    "crates/orca-tools-pi",
    "crates/orca-cli",
    "crates/orca-testkit",
    "crates/orca-crosscheck",
]

[workspace.package]
version = "0.15.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

# Versions are pinned exactly (=x.y.z) and Cargo.lock is committed: third-party code is
# untrusted, so upgrades are deliberate (see PORTING.md, "Dependencies").
[workspace.dependencies]
orca-abstractions = { path = "crates/orca-abstractions" }
orca-core = { path = "crates/orca-core" }
orca-tools-common = { path = "crates/orca-tools-common" }
orca-tools-fs = { path = "crates/orca-tools-fs" }
orca-tools-shell = { path = "crates/orca-tools-shell" }
orca-tools-git = { path = "crates/orca-tools-git" }
orca-tools-web = { path = "crates/orca-tools-web" }
orca-tools-utility = { path = "crates/orca-tools-utility" }
orca-tools-archive = { path = "crates/orca-tools-archive" }
orca-tools-network = { path = "crates/orca-tools-network" }
orca-tools-mcp = { path = "crates/orca-tools-mcp" }
orca-tools-lsp = { path = "crates/orca-tools-lsp" }
orca-tools-image = { path = "crates/orca-tools-image" }
orca-tools-pi = { path = "crates/orca-tools-pi" }
orca-testkit = { path = "crates/orca-testkit" }

anyhow = "=1.0.105"
async-trait = "=0.1.92"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "=0.23.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
globset = "=0.4.22"
# Only for `hyper::ext::ReasonPhrase` (web_fetch's "HTTP <code> <reason>"); already in the tree via reqwest.
hyper = { version = "=1.13.0", default-features = false, features = ["http1", "client"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
indexmap = { version = "=2.14.2", features = ["serde"] }
regex = "=1.13.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "transport-child-process", "base64"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.10.8"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync", "net"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter", "std"] }
unicode-normalization = "=0.1.23"
walkdir = "=2.5.1"
windows-version = "=0.1.1"
zip = { version = "=9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
