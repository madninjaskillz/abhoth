# The website: builds site/ (no dependencies, `node site/build.mjs`) and deploys it to GitHub Pages.
#
# - Build: on the self-hosted runners (Node comes from the runner image), on pushes to main that
#   touch site/ and on workflow_dispatch.
# - Deploy: only when the repository variable PAGES_ENABLED is "true" (Settings > Secrets and
#   variables > Actions > Variables) and Pages is set to "GitHub Actions" (Settings > Pages).
#   Until then the build still runs and checks the site, but nothing is published.
# - Base path: without site/public/CNAME the site is built for https://madninjaskillz.github.io/abhoth/.
#   For a custom domain, add site/public/CNAME holding the domain (e.g. abhoth.co.uk): the build
#   then uses "/" and https://<domain> for links, canonical URLs, the sitemap and OpenGraph.
#   Set the same domain in Settings > Pages, add the DNS records, then tick "Enforce HTTPS".
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, abhoth]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Build the site
        run: node --version && node site/build.mjs

      - name: Check the output
        run: |
          test -f site/dist/index.html
          test -f site/dist/404.html
          test -f site/dist/sitemap.xml
          test -f site/dist/robots.txt
          # Nothing private in the published files.
          if grep -rIlE '192\.168\.[0-9]|[A-Z]:.Users.[A-Za-z]' site/dist; then
            echo "private path or address in site/dist" >&2; exit 1
          fi

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
