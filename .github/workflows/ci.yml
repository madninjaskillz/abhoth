# CI of the abhoth repo. The cross-check against the C# reference is not here (it needs the
# openorca repo; see README, "Tests and the cross-check").
#
# Where the jobs run (deploy/ci-runner/README.md):
# - Linux jobs on the self-hosted runners on deepthought (`abhoth-ci`, label `abhoth`): fmt,
#   clippy and tests (default features and the desktop feature), the React client, and
#   `package`, which cross-compiles abhoth.exe / abhoth-desktop.exe with cargo-xwin, runs
#   clippy for the Windows target, and packs a Velopack Setup.exe and a Linux AppImage
#   (kept on deepthought; an artifact on workflow_dispatch and tags; a Release on tags), only
#   after rust-linux, rust-windows and client pass.
# - Windows (GitHub-hosted): the tests only, because they exercise Windows behaviour
#   (ConPTY, paths, the shell tool); clippy for Windows is the cross job's.
# - macOS (GitHub-hosted, 10x minutes): the desktop feature only on workflow_dispatch or a tag.
#
# Rollback to hosted runners: change `runs-on: [self-hosted, linux, abhoth]` back to
# `ubuntu-latest` (the desktop job then needs its apt step again; see the README).
name: CI

on:
  push:
    branches: [main]
    tags: ['abhoth-v*']
    # The website (site/) has its own workflow, site.yml.
    paths-ignore: ['site/**', '.github/workflows/site.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

# Debug info off: the full workspace's test binaries with debug info fill a hosted runner's
# disk (ld died with a bus error on ubuntu-latest), and keep the deepthought caches small.
# Incremental builds are useless on CI.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  # Format, clippy (with and without the desktop feature) and the whole test suite, with the
  # desktop feature on so its unit tests run too (D114).
  rust-linux:
    # Never on a pull request from a fork (the runner's job-started hook refuses those too).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, abhoth]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain
        run: rustup show active-toolchain

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy (desktop)
        run: cargo clippy --workspace --all-targets --locked --features orca-cli/desktop -- -D warnings

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast --features orca-cli/desktop

      - name: Clippy and tests (router, Claude engine)
        run: |
          cargo clippy -p orca-router --all-targets --locked --features claude-engine -- -D warnings
          cargo test -p orca-router --locked --no-fail-fast --features claude-engine

  # Windows: the tests (desktop feature included), on a GitHub-hosted runner.
  rust-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Neutral paths in the binaries (home, cargo registry, checkout), as on the self-hosted
      # runners (their RUSTFLAGS is in deploy/ci-runner/compose.yaml).
      - name: Path remapping
        shell: bash
        run: |
          w() { if command -v cygpath > /dev/null; then cygpath -w "$1"; else echo "$1"; fi; }
          echo "RUSTFLAGS=--remap-path-prefix=$(w "$HOME")=/home --remap-path-prefix=$(w "${CARGO_HOME:-$HOME/.cargo}")=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/src" >> "$GITHUB_ENV"

      # Swatinem/rust-cache v2.9.3: the dependency builds survive between runs, which is
      # most of this job's minutes.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: windows-test

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast --features orca-cli/desktop

  # macOS: the desktop feature builds and its unit tests pass. Only by hand or on a tag.
  desktop-macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Neutral paths in the binaries (home, cargo registry, checkout), as on the self-hosted
      # runners (their RUSTFLAGS is in deploy/ci-runner/compose.yaml).
      - name: Path remapping
        shell: bash
        run: |
          w() { if command -v cygpath > /dev/null; then cygpath -w "$1"; else echo "$1"; fi; }
          echo "RUSTFLAGS=--remap-path-prefix=$(w "$HOME")=/home --remap-path-prefix=$(w "${CARGO_HOME:-$HOME/.cargo}")=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/src" >> "$GITHUB_ENV"

      - name: Clippy
        run: cargo clippy -p orca-cli --all-targets --features desktop --locked -- -D warnings

      - name: Test
        run: cargo test -p orca-cli --features desktop --locked --lib desktop

  # The React client: typecheck, tests, and the checked-in dist and dist-router must match a
  # fresh build (the binaries embed client/dist; the router embeds client/dist-router, D151).
  # Node comes from the runner image.
  client:
    # Never on a pull request from a fork (the runner's job-started hook refuses those too).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, abhoth]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
      - run: node --version
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: dist is up to date
        run: |
          git diff --exit-code --stat -- dist dist-router
          test -z "$(git status --porcelain --untracked-files=all -- dist dist-router)"

  # The single image (root Dockerfile, D148): builds, and the container starts healthy with
  # the web UI on; a router with a bad config is restarted with backoff while the web UI keeps
  # running (self-healing parts).
  # GitHub-hosted: the self-hosted runners have no Docker. Not pushed anywhere (yet).
  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: docker build -t abhoth:ci .
      - name: The binary's parts
        run: |
          docker run --rm --entrypoint /app/abhoth abhoth:ci --version
          docker run --rm --entrypoint /app/abhoth abhoth:ci router --help >/dev/null
          docker run --rm --entrypoint /app/abhoth abhoth:ci supervisor 2>&1 | grep -q usage
      - name: Starts healthy (web UI)
        run: |
          mkdir -p data && sudo chown 568:568 data
          docker run -d --name abhoth --network host --read-only --tmpfs /tmp             -e PORT=18093 -v "$PWD/data:/data" abhoth:ci
          for i in $(seq 1 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' abhoth)
            [ "$s" = healthy ] && break
            sleep 5
          done
          docker logs abhoth 2>&1 | tail -20
          [ "$(docker inspect -f '{{.State.Health.Status}}' abhoth)" = healthy ]
          curl -fsS http://127.0.0.1:18093/api/auth/state
          docker stop -t 15 abhoth
          [ "$(docker inspect -f '{{.State.ExitCode}}' abhoth)" = 0 ]
      - name: A failed part is restarted and the web UI keeps running
        run: |
          docker rm -f abhoth
          docker run -d --name abhoth2 --network host --read-only --tmpfs /tmp             -e PORT=18094 -e ROUTER_ARGS="--config /data/router/missing.json --port 18010"             -v "$PWD/data:/data" abhoth:ci
          for i in $(seq 1 30); do
            docker logs abhoth2 2>&1 | grep -q 'restarting the router (restart 2)' && break
            sleep 2
          done
          docker logs abhoth2 2>&1 | tail -5
          docker logs abhoth2 2>&1 | grep -q 'restarting the router (restart 2)'
          [ "$(docker inspect -f '{{.State.Running}}' abhoth2)" = true ]
          curl -fsS http://127.0.0.1:18094/api/auth/state
          docker stop -t 15 abhoth2

  # The Windows exes cross-compiled on Linux (cargo-xwin, x86_64-pc-windows-msvc), clippy for
  # the Windows target, the Linux release build, and Velopack packages of both: a Windows
  # Setup.exe and a Linux AppImage. Kept on deepthought (builds/); an artifact by hand or on
  # a tag; a GitHub Release on a tag. Only after the tests pass, so a failing test never
  # publishes a release.
  package:
    needs: [rust-linux, rust-windows, client]
    # Never on a pull request from a fork (the runner's job-started hook refuses those too).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, abhoth]
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      WIN: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6

      - name: Version
        id: version
        run: |
          base=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "orca-cli") | .version')
          if [[ "$GITHUB_REF" == refs/tags/abhoth-v* ]]; then
            version="${GITHUB_REF#refs/tags/abhoth-v}"
            [ "$version" = "$base" ] || { echo "::error::tag $version but Cargo.toml says $base"; exit 1; }
          else
            version="$base-ci.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      - name: Clippy (Windows target)
        run: cargo xwin clippy --target "$WIN" --workspace --all-targets --locked --features orca-cli/desktop -- -D warnings

      # The runner's RUSTFLAGS remaps the CI paths (deploy/ci-runner/compose.yaml). cc-rs maps
      # them for gcc on Linux but not for clang-cl, so the C sources (aws-lc-sys) kept their
      # registry paths in the exes: the same prefixes as clang-cl file-prefix-maps.
      - name: Build abhoth.exe and abhoth-desktop.exe (cross-compiled)
        run: |
          CFLAGS="${RUSTFLAGS//--remap-path-prefix=//clang:-ffile-prefix-map=}"             cargo xwin build --release --locked --target "$WIN" -p orca-cli --features desktop --bins

      - name: Build abhoth and abhoth-desktop (Linux)
        run: cargo build --release --locked -p orca-cli --features desktop --bins

      - name: Velopack packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pkg"; rm -rf "$out"; mkdir -p "$out/win" "$out/linux" "$out/dist"
          # A release carries a delta from the previous one: vpk makes it when the previous
          # full package is in its output folder (none before the first Velopack release).
          # The delta needs the zstd 1.5.7 the runner image builds (Ubuntu 24.04's 1.5.5
          # fails vpk's `--patch-from ... --long=27` with "missing command argument").
          if [[ "$GITHUB_REF" == refs/tags/abhoth-v* ]]; then
            for ch in win linux; do
              vpk download github --repoUrl "$REPO_URL" --token "$GH_TOKEN" --channel "$ch" \
                --outputDir "$out/vpk-$ch" || echo "No previous $ch release to delta against."
            done
          fi
          rel="$CARGO_TARGET_DIR/$WIN/release"
          cp "$rel/abhoth.exe" "$rel/abhoth-desktop.exe" "$out/win/"
          cp "$CARGO_TARGET_DIR/release/abhoth" "$CARGO_TARGET_DIR/release/abhoth-desktop" "$out/linux/"
          file "$out/win/"*.exe "$out/linux/"*

          vpk '[win]' pack --packId Abhoth --packVersion "$VERSION" --packTitle Abhoth \
            --packAuthors Abhoth --runtime win-x64 --channel win --shortcuts StartMenuRoot \
            --packDir "$out/win" --mainExe abhoth-desktop.exe \
            --icon assets/abhoth/icons/abhoth.ico --outputDir "$out/vpk-win"
          # The Linux package is one file, the AppImage, and vpk squashes it with gzip: every
          # compressed block changes between builds, so zstd's delta saved ~10% (66 of 74 MB).
          # An uncompressed squashfs (mksquashfs -noI -noD -noF -noX, via a wrapper ahead of it
          # on PATH) lets the delta see the binaries (~14 MB); the nupkg is still zipped, so the
          # full download stays ~69 MB, but the AppImage itself is ~177 MB. Stripped first: the
          # symbol tables are ~25 MB of each binary (the Windows exes carry none either).
          strip "$out/linux/abhoth" "$out/linux/abhoth-desktop"
          sq="$RUNNER_TEMP/mksquashfs-raw"; mkdir -p "$sq"
          printf '#!/bin/sh\nexec %s "$@" -noI -noD -noF -noX\n' "$(command -v mksquashfs)" > "$sq/mksquashfs"
          chmod +x "$sq/mksquashfs"
          PATH="$sq:$PATH" vpk '[linux]' pack --packId Abhoth --packVersion "$VERSION" --packTitle Abhoth \
            --packAuthors Abhoth --runtime linux-x64 --channel linux \
            --packDir "$out/linux" --mainExe abhoth-desktop \
            --icon assets/abhoth/icons/abhoth-256.png --outputDir "$out/vpk-linux"
          ls -la "$out/vpk-win" "$out/vpk-linux"

          # Found by glob: vpk's file names carry the channel and can change with a release.
          setup=$(ls "$out"/vpk-win/*Setup.exe | head -1)
          appimage=$(ls "$out"/vpk-linux/*.AppImage | head -1)
          cp "$setup" "$out/dist/abhoth-$VERSION-win-x64-setup.exe"
          cp "$appimage" "$out/dist/abhoth-$VERSION-linux-x64.AppImage"
          (cd "$out/win" && zip -q -9 "$out/dist/abhoth-$VERSION-win-x64.zip" abhoth.exe abhoth-desktop.exe)
          (cd "$out/dist" && sha256sum * > SHA256SUMS)
          cat "$out/dist/SHA256SUMS"
          ls -la "$out/dist"

          # A copy on deepthought, the last five kept (the artifact storage quota is small).
          keep="$CI_ROOT/builds"; mkdir -p "$keep"
          cp -r "$out/dist" "$keep/$GITHUB_RUN_NUMBER-${GITHUB_SHA::8}"
          ls -1dt "$keep"/*/ | tail -n +6 | xargs -r rm -rf

      # Only by hand or on a tag (~110 MB each), short retention and non-fatal: the account's
      # artifact storage quota is small. Every push's build is kept on deepthought (above).
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        with:
          name: abhoth-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/pkg/dist/*
          retention-days: 3
          if-no-files-found: error

      # The Velopack feed (releases.<channel>.json, full and delta .nupkg, Setup, Portable) is
      # what installed apps update from (D136); then the renamed downloads and SHA256SUMS.
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/abhoth-v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          for ch in win linux; do
            vpk upload github --repoUrl "$REPO_URL" --token "$GH_TOKEN" --channel "$ch" \
              --tag "$GITHUB_REF_NAME" --releaseName "Abhoth $VERSION" --publish --merge \
              --outputDir "$RUNNER_TEMP/pkg/vpk-$ch"
          done
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/pkg/dist/* --clobber
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
