# Abhoth in one container (D148): the web UI, and optionally Sothoth (the router) and Nodens
# (the supervisor). docs/NAMES.md has the names; every old name below still works.
#   docker compose up -d --build
#   docker compose exec abhoth /app/entrypoint.sh admin create <user>   # the first admin
# Then open http://<host>:8093. See README.md, "Docker".
#
# Everything lives under ./abhoth-data (bind mounts; change the left-hand paths as you like):
#   abhoth-data/web         web UI state (accounts, sessions, Claude/Codex logins)
#   abhoth-data/router      sothoth.json / sothoth.toml (or router.json / router.toml) and
#                           Sothoth's own state
#   abhoth-data/supervisor  nodens.toml or supervisor.toml (and the secret files it names)
#   abhoth-data/projects    the projects the agent works in
#   abhoth-data/secrets     read-only secrets (strata-api-key, git-deploy-key, ...)
# The folders must be writable by uid 568 (e.g. `sudo chown -R 568:568 abhoth-data`).
services:
  abhoth:
    build: .
    image: abhoth:latest
    restart: unless-stopped
    init: false                       # the image runs tini itself
    # Linux: host networking (the router's ports and the model servers on the LAN, no port
    # list to keep in step). Elsewhere (Docker Desktop), delete this line and use `ports:`.
    network_mode: host
    # ports: ["8093:8093", "8010:8010", "8092:8092", "8098:8098", "8099:8099"]
    user: "568:568"
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 10g
    pids_limit: 4096
    environment:
      PORT: "8093"
      REQUIRE_2FA: "0"                # 1 = an authenticator code at every sign-in
      # TRUSTED_PROXIES: "10.0.0.2"   # a reverse proxy in front: X-Forwarded-* only from it
      # BENCH: "1"                    # the Benchmarks page (in /data/web/bench)
      #
      # Sothoth, the router (gateway + control plane, ROUTER.md and ROUTER-CONFIG.md). Its
      # flags, as for `abhoth sothoth`; whitespace-separated, no quoting (ROUTER_ARGS works too;
      # a missing sothoth.* file reads the folder's router.* file):
      # SOTHOTH_ARGS: "--config /data/router/sothoth.json --port 8010 --control /data/router/sothoth.toml"
      # SOTHOTH_HEALTH_URL: "http://127.0.0.1:8010/health/liveliness"   # or ROUTER_HEALTH_URL
      #
      # Nodens, the supervisor (telemetry hub, Home Assistant, the Glance page's feed;
      # docs/design/SUPERVISOR.md). It talks to hostd on the host for fans and clocks (optional,
      # crates/orca-hostd/deploy): mount /run/abhoth below.
      # NODENS_CONFIG: "/data/supervisor/nodens.toml"            # or SUPERVISOR_CONFIG
      # ABHOTH_NODENS_URL: "http://127.0.0.1:9890"   # its [supervisor] listen; or ABHOTH_SUPERVISOR_URL
      #
      # The Glance page's card buttons and calendar: Sothoth's admin API (or ABHOTH_ROUTER_URL /
      # ABHOTH_ROUTER_TOKEN_FILE).
      # ABHOTH_SOTHOTH_URL: "http://127.0.0.1:8010"
      # ABHOTH_SOTHOTH_TOKEN_FILE: "/run/secrets/router-link-token"
    volumes:
      - ./abhoth-data/web:/data/web
      - ./abhoth-data/router:/data/router
      - ./abhoth-data/supervisor:/data/supervisor
      - ./abhoth-data/projects:/data/projects
      - ./abhoth-data/secrets:/run/secrets:ro
      # hostd's socket (fans, clocks, GPU telemetry), when it is installed on the host; add
      # group_add: ["<the socket's group id>"] above so uid 568 may connect.
      # - /run/abhoth:/run/abhoth:ro
